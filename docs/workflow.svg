<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 250" width="960" height="250" font-family="Segoe UI, Inter, Roboto, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a8a8a"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="250" rx="16" fill="#0f0f0f"/>
  <!-- step 1 -->
  <g transform="translate(24,52)">
    <rect width="190" height="120" rx="14" fill="#212121"/>
    <circle cx="30" cy="30" r="14" fill="#ff0033"/><text x="30" y="35" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">1</text>
    <text x="54" y="36" font-size="17" font-weight="600" fill="#f1f1f1">Search</text>
    <text x="18" y="72" font-size="13" fill="#aaaaaa">Type words or paste</text>
    <text x="18" y="92" font-size="13" fill="#aaaaaa">a YouTube link / file</text>
  </g>
  <line x1="220" y1="112" x2="252" y2="112" stroke="#8a8a8a" stroke-width="2" marker-end="url(#arr)"/>
  <!-- step 2 -->
  <g transform="translate(258,52)">
    <rect width="190" height="120" rx="14" fill="#212121"/>
    <circle cx="30" cy="30" r="14" fill="#ff0033"/><text x="30" y="35" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">2</text>
    <text x="54" y="36" font-size="17" font-weight="600" fill="#f1f1f1">Watch</text>
    <text x="18" y="72" font-size="13" fill="#aaaaaa">Built-in mpv player,</text>
    <text x="18" y="92" font-size="13" fill="#aaaaaa">no web browser</text>
  </g>
  <line x1="454" y1="112" x2="486" y2="112" stroke="#8a8a8a" stroke-width="2" marker-end="url(#arr)"/>
  <!-- step 3 -->
  <g transform="translate(492,52)">
    <rect width="190" height="120" rx="14" fill="#212121"/>
    <circle cx="30" cy="30" r="14" fill="#ff0033"/><text x="30" y="35" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">3</text>
    <text x="54" y="36" font-size="17" font-weight="600" fill="#f1f1f1">Mark clips</text>
    <text x="18" y="72" font-size="13" fill="#aaaaaa">Press I and O at the</text>
    <text x="18" y="92" font-size="13" fill="#aaaaaa">start / end of each part</text>
    <rect x="18" y="104" width="154" height="4" rx="2" fill="#4d4d4d"/>
    <rect x="36" y="101" width="22" height="10" fill="#2ecc71"/><rect x="92" y="101" width="18" height="10" fill="#2ecc71"/><rect x="136" y="101" width="14" height="10" fill="#2ecc71"/>
  </g>
  <line x1="688" y1="112" x2="720" y2="112" stroke="#8a8a8a" stroke-width="2" marker-end="url(#arr)"/>
  <!-- step 4 -->
  <g transform="translate(726,32)">
    <rect width="210" height="186" rx="14" fill="#212121"/>
    <circle cx="30" cy="30" r="14" fill="#ff0033"/><text x="30" y="35" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">4</text>
    <text x="54" y="36" font-size="17" font-weight="600" fill="#f1f1f1">Extract</text>
    <g font-size="13">
      <rect x="16" y="56" width="178" height="30" rx="15" fill="#f1f1f1"/><text x="105" y="76" text-anchor="middle" fill="#0f0f0f" font-weight="600">Voice only (no BGM)</text>
      <rect x="16" y="94" width="85" height="30" rx="15" fill="#272727"/><text x="58" y="114" text-anchor="middle" fill="#f1f1f1">Audio</text>
      <rect x="109" y="94" width="85" height="30" rx="15" fill="#272727"/><text x="151" y="114" text-anchor="middle" fill="#f1f1f1">Video</text>
      <text x="16" y="150" fill="#aaaaaa">Several clips are joined</text>
      <text x="16" y="170" fill="#aaaaaa">into ONE file</text>
    </g>
  </g>
</svg>
